name: ${COMPOSE_PROJECT_NAME}

x-koleo-service: &koleo-service
  image: ${KOLEO_IMAGE}:${KOLEO_IMAGE_TAG}
  read_only: ${CONTAINER_READ_ONLY}
  cap_drop:
    - ${CONTAINER_CAP_DROP}
  security_opt:
    - ${CONTAINER_SECURITY_OPT}
  pids_limit: ${CONTAINER_PIDS_LIMIT}
  mem_limit: ${CONTAINER_MEMORY_LIMIT}
  cpus: ${CONTAINER_CPU_LIMIT}
  environment:
    NODE_ENV: ${NODE_ENV}
    HOST: ${CONTAINER_HOST}
    PORT: ${CONTAINER_PORT}
    DB_CONNECTION: ${DB_CONNECTION}
    DB_DATABASE: ${CONTAINER_DB_DATABASE}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS}
    DB_BACKUP_DIR: ${CONTAINER_DB_BACKUP_DIR}
    DB_BACKUP_RETENTION_COUNT: ${DB_BACKUP_RETENTION_COUNT}
    KOLEO_API_BASE_URL: ${KOLEO_API_BASE_URL}
    KOLEO_CLIENT_USER_AGENT: ${KOLEO_CLIENT_USER_AGENT}
    KOLEO_CLIENT_NAME: ${KOLEO_CLIENT_NAME}
    KOLEO_CLIENT_VERSION: ${KOLEO_CLIENT_VERSION}
    KOLEO_EOL_RESPONSE_VERSION: ${KOLEO_EOL_RESPONSE_VERSION}
    KOLEO_REQUEST_TIMEOUT_MS: ${KOLEO_REQUEST_TIMEOUT_MS}
    KOLEO_REQUEST_MAX_RETRIES: ${KOLEO_REQUEST_MAX_RETRIES}
    KOLEO_REQUEST_RETRY_BASE_DELAY_MS: ${KOLEO_REQUEST_RETRY_BASE_DELAY_MS}
    KOLEO_REQUEST_RETRY_MAX_DELAY_MS: ${KOLEO_REQUEST_RETRY_MAX_DELAY_MS}
    KOLEO_REQUEST_MAX_CONCURRENCY: ${KOLEO_REQUEST_MAX_CONCURRENCY}
    TICKET_SALES_MAX_ADVANCE_DAYS: ${TICKET_SALES_MAX_ADVANCE_DAYS}
    BODY_PARSER_FORM_LIMIT: ${BODY_PARSER_FORM_LIMIT}
    BODY_PARSER_JSON_LIMIT: ${BODY_PARSER_JSON_LIMIT}
    BODY_PARSER_MULTIPART_LIMIT: ${BODY_PARSER_MULTIPART_LIMIT}
    HEALTH_WORKER_STALE_SECONDS: ${HEALTH_WORKER_STALE_SECONDS}
    METRICS_TOKEN: ${METRICS_TOKEN}
    HEALTHCHECK_HOST: ${CONTAINER_HEALTHCHECK_HOST}
    HEALTHCHECK_PATH: ${HEALTHCHECK_PATH}
  volumes:
    - ${APP_ENV_FILE}:${CONTAINER_ENV_FILE}:ro
    - koleo_data:${CONTAINER_DATA_DIR}
  tmpfs:
    - ${CONTAINER_SYSTEM_TMPFS}
    - ${CONTAINER_APP_TMPFS}
  working_dir: ${CONTAINER_WEB_HOME}
  init: ${CONTAINER_INIT}
  stop_grace_period: ${STOP_GRACE_PERIOD}

services:
  migrate:
    <<: *koleo-service
    command: ["node", "ace.js", "migration:run", "--force"]
    restart: ${MIGRATION_RESTART_POLICY}

  web:
    <<: *koleo-service
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        APP_HOME: ${CONTAINER_APP_HOME}
        APP_PORT: ${CONTAINER_PORT}
        APP_DATA_DIR: ${CONTAINER_DATA_DIR}
        NATIVE_BUILD_PACKAGES: ${NATIVE_BUILD_PACKAGES}
        BUILD_DB_CONNECTION: ${DB_CONNECTION}
        BUILD_SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS}
        BUILD_DB_BACKUP_DIR: ${CONTAINER_DB_BACKUP_DIR}
        BUILD_DB_BACKUP_RETENTION_COUNT: ${DB_BACKUP_RETENTION_COUNT}
        BUILD_TICKET_SALES_MAX_ADVANCE_DAYS: ${TICKET_SALES_MAX_ADVANCE_DAYS}
        BUILD_BODY_PARSER_FORM_LIMIT: ${BODY_PARSER_FORM_LIMIT}
        BUILD_BODY_PARSER_JSON_LIMIT: ${BODY_PARSER_JSON_LIMIT}
        BUILD_BODY_PARSER_MULTIPART_LIMIT: ${BODY_PARSER_MULTIPART_LIMIT}
        BUILD_HEALTH_WORKER_STALE_SECONDS: ${HEALTH_WORKER_STALE_SECONDS}
      secrets:
        - app_env
    command: ["node", "bin/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PUBLISHED_PORT}:${CONTAINER_PORT}"
    restart: ${SERVICE_RESTART_POLICY}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://' + process.env.HEALTHCHECK_HOST + ':' + process.env.PORT + process.env.HEALTHCHECK_PATH)
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}

  worker:
    <<: *koleo-service
    command: ["node", "ace.js", "alerts:worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: ${SERVICE_RESTART_POLICY}

volumes:
  koleo_data:
    name: ${KOLEO_DATA_VOLUME}

secrets:
  app_env:
    file: ${APP_ENV_FILE}
