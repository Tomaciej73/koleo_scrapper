name: ${COMPOSE_PROJECT_NAME}

x-koleo-service: &koleo-service
  image: ${KOLEO_IMAGE}:${KOLEO_IMAGE_TAG}
  read_only: ${CONTAINER_READ_ONLY}
  cap_drop:
    - ${CONTAINER_CAP_DROP}
  security_opt:
    - ${CONTAINER_SECURITY_OPT}
  pids_limit: ${CONTAINER_PIDS_LIMIT}
  mem_limit: ${CONTAINER_MEMORY_LIMIT}
  cpus: ${CONTAINER_CPU_LIMIT}
  environment:
    NODE_ENV: ${NODE_ENV}
    HOST: ${CONTAINER_HOST}
    PORT: ${CONTAINER_PORT}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES}
    DB_CONNECTION: ${DB_CONNECTION}
    DB_DATABASE: ${CONTAINER_DB_DATABASE}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS}
    DB_BACKUP_DIR: ${CONTAINER_DB_BACKUP_DIR}
    DB_BACKUP_RETENTION_COUNT: ${DB_BACKUP_RETENTION_COUNT}
    LIMITER_STORE: ${LIMITER_STORE}
    RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS}
    RATE_LIMIT_LOGIN_FAILURES: ${RATE_LIMIT_LOGIN_FAILURES}
    RATE_LIMIT_OTP_REQUESTS: ${RATE_LIMIT_OTP_REQUESTS}
    RATE_LIMIT_SEARCH_REQUESTS: ${RATE_LIMIT_SEARCH_REQUESTS}
    RATE_LIMIT_CHECK_NOW_REQUESTS: ${RATE_LIMIT_CHECK_NOW_REQUESTS}
    RATE_LIMIT_PASSWORD_RESET_REQUESTS: ${RATE_LIMIT_PASSWORD_RESET_REQUESTS}
    RATE_LIMIT_CSP_REPORT_REQUESTS: ${RATE_LIMIT_CSP_REPORT_REQUESTS}
    RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS}
    RATE_LIMIT_SEARCH_WINDOW_SECONDS: ${RATE_LIMIT_SEARCH_WINDOW_SECONDS}
    RATE_LIMIT_CHECK_NOW_WINDOW_SECONDS: ${RATE_LIMIT_CHECK_NOW_WINDOW_SECONDS}
    RATE_LIMIT_BLOCK_SECONDS: ${RATE_LIMIT_BLOCK_SECONDS}
    CSP_ENABLED: ${CSP_ENABLED}
    CSP_REPORT_ONLY: ${CSP_REPORT_ONLY}
    CSP_DEFAULT_SRC: ${CSP_DEFAULT_SRC}
    CSP_SCRIPT_SRC: ${CSP_SCRIPT_SRC}
    CSP_STYLE_SRC: ${CSP_STYLE_SRC}
    CSP_IMG_SRC: ${CSP_IMG_SRC}
    CSP_FONT_SRC: ${CSP_FONT_SRC}
    CSP_CONNECT_SRC: ${CSP_CONNECT_SRC}
    CSP_OBJECT_SRC: ${CSP_OBJECT_SRC}
    CSP_BASE_URI: ${CSP_BASE_URI}
    CSP_FORM_ACTION: ${CSP_FORM_ACTION}
    CSP_FRAME_ANCESTORS: ${CSP_FRAME_ANCESTORS}
    CSP_REPORT_URI: ${CSP_REPORT_URI}
    CSP_UPGRADE_INSECURE_REQUESTS: ${CSP_UPGRADE_INSECURE_REQUESTS}
    PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
    PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH}
    PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES}
    PASSWORD_RESET_MIN_RESPONSE_MS: ${PASSWORD_RESET_MIN_RESPONSE_MS}
    PASSWORD_RESET_RESPONSE_JITTER_MS: ${PASSWORD_RESET_RESPONSE_JITTER_MS}
    PRICE_WATCH_MAX_PER_USER: ${PRICE_WATCH_MAX_PER_USER}
    ALERT_DAILY_MAX_MESSAGES_PER_USER: ${ALERT_DAILY_MAX_MESSAGES_PER_USER}
    ALERT_WATCH_LOCK_TIMEOUT_SECONDS: ${ALERT_WATCH_LOCK_TIMEOUT_SECONDS}
    ALERT_OUTBOX_BATCH_SIZE: ${ALERT_OUTBOX_BATCH_SIZE}
    ALERT_OUTBOX_MAX_ATTEMPTS: ${ALERT_OUTBOX_MAX_ATTEMPTS}
    ALERT_OUTBOX_RETRY_BASE_SECONDS: ${ALERT_OUTBOX_RETRY_BASE_SECONDS}
    ALERT_OUTBOX_RETRY_MAX_SECONDS: ${ALERT_OUTBOX_RETRY_MAX_SECONDS}
    ALERT_OUTBOX_LOCK_TIMEOUT_SECONDS: ${ALERT_OUTBOX_LOCK_TIMEOUT_SECONDS}
    PRICE_HISTORY_RETENTION_DAYS: ${PRICE_HISTORY_RETENTION_DAYS}
    KOLEO_API_BASE_URL: ${KOLEO_API_BASE_URL}
    KOLEO_CLIENT_USER_AGENT: ${KOLEO_CLIENT_USER_AGENT}
    KOLEO_CLIENT_NAME: ${KOLEO_CLIENT_NAME}
    KOLEO_CLIENT_VERSION: ${KOLEO_CLIENT_VERSION}
    KOLEO_EOL_RESPONSE_VERSION: ${KOLEO_EOL_RESPONSE_VERSION}
    KOLEO_REQUEST_TIMEOUT_MS: ${KOLEO_REQUEST_TIMEOUT_MS}
    KOLEO_REQUEST_MAX_RETRIES: ${KOLEO_REQUEST_MAX_RETRIES}
    KOLEO_REQUEST_RETRY_BASE_DELAY_MS: ${KOLEO_REQUEST_RETRY_BASE_DELAY_MS}
    KOLEO_REQUEST_RETRY_MAX_DELAY_MS: ${KOLEO_REQUEST_RETRY_MAX_DELAY_MS}
    KOLEO_REQUEST_MAX_CONCURRENCY: ${KOLEO_REQUEST_MAX_CONCURRENCY}
    TICKET_SALES_MAX_ADVANCE_DAYS: ${TICKET_SALES_MAX_ADVANCE_DAYS}
    BODY_PARSER_FORM_LIMIT: ${BODY_PARSER_FORM_LIMIT}
    BODY_PARSER_JSON_LIMIT: ${BODY_PARSER_JSON_LIMIT}
    BODY_PARSER_MULTIPART_LIMIT: ${BODY_PARSER_MULTIPART_LIMIT}
    HEALTH_WORKER_STALE_SECONDS: ${HEALTH_WORKER_STALE_SECONDS}
    METRICS_TOKEN: ${METRICS_TOKEN}
    HEALTHCHECK_HOST: ${CONTAINER_HEALTHCHECK_HOST}
    HEALTHCHECK_PATH: ${HEALTHCHECK_PATH}
  volumes:
    - ${APP_ENV_FILE}:${CONTAINER_ENV_FILE}:ro
    - koleo_data:${CONTAINER_DATA_DIR}
  tmpfs:
    - ${CONTAINER_SYSTEM_TMPFS}
    - ${CONTAINER_APP_TMPFS}
  working_dir: ${CONTAINER_WEB_HOME}
  init: ${CONTAINER_INIT}
  stop_grace_period: ${STOP_GRACE_PERIOD}

services:
  migrate:
    <<: *koleo-service
    command: ["node", "ace.js", "migration:run", "--force"]
    restart: ${MIGRATION_RESTART_POLICY}

  web:
    <<: *koleo-service
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        APP_HOME: ${CONTAINER_APP_HOME}
        APP_PORT: ${CONTAINER_PORT}
        APP_DATA_DIR: ${CONTAINER_DATA_DIR}
        NATIVE_BUILD_PACKAGES: ${NATIVE_BUILD_PACKAGES}
        BUILD_DB_CONNECTION: ${DB_CONNECTION}
        BUILD_SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS}
        BUILD_DB_BACKUP_DIR: ${CONTAINER_DB_BACKUP_DIR}
        BUILD_DB_BACKUP_RETENTION_COUNT: ${DB_BACKUP_RETENTION_COUNT}
        BUILD_LIMITER_STORE: ${LIMITER_STORE}
        BUILD_RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS}
        BUILD_RATE_LIMIT_LOGIN_FAILURES: ${RATE_LIMIT_LOGIN_FAILURES}
        BUILD_RATE_LIMIT_OTP_REQUESTS: ${RATE_LIMIT_OTP_REQUESTS}
        BUILD_RATE_LIMIT_SEARCH_REQUESTS: ${RATE_LIMIT_SEARCH_REQUESTS}
        BUILD_RATE_LIMIT_CHECK_NOW_REQUESTS: ${RATE_LIMIT_CHECK_NOW_REQUESTS}
        BUILD_RATE_LIMIT_PASSWORD_RESET_REQUESTS: ${RATE_LIMIT_PASSWORD_RESET_REQUESTS}
        BUILD_RATE_LIMIT_CSP_REPORT_REQUESTS: ${RATE_LIMIT_CSP_REPORT_REQUESTS}
        BUILD_RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS}
        BUILD_RATE_LIMIT_SEARCH_WINDOW_SECONDS: ${RATE_LIMIT_SEARCH_WINDOW_SECONDS}
        BUILD_RATE_LIMIT_CHECK_NOW_WINDOW_SECONDS: ${RATE_LIMIT_CHECK_NOW_WINDOW_SECONDS}
        BUILD_RATE_LIMIT_BLOCK_SECONDS: ${RATE_LIMIT_BLOCK_SECONDS}
        BUILD_TRUSTED_PROXIES: ${TRUSTED_PROXIES}
        BUILD_CSP_ENABLED: ${CSP_ENABLED}
        BUILD_CSP_REPORT_ONLY: ${CSP_REPORT_ONLY}
        BUILD_CSP_DEFAULT_SRC: ${CSP_DEFAULT_SRC}
        BUILD_CSP_SCRIPT_SRC: ${CSP_SCRIPT_SRC}
        BUILD_CSP_STYLE_SRC: ${CSP_STYLE_SRC}
        BUILD_CSP_IMG_SRC: ${CSP_IMG_SRC}
        BUILD_CSP_FONT_SRC: ${CSP_FONT_SRC}
        BUILD_CSP_CONNECT_SRC: ${CSP_CONNECT_SRC}
        BUILD_CSP_OBJECT_SRC: ${CSP_OBJECT_SRC}
        BUILD_CSP_BASE_URI: ${CSP_BASE_URI}
        BUILD_CSP_FORM_ACTION: ${CSP_FORM_ACTION}
        BUILD_CSP_FRAME_ANCESTORS: ${CSP_FRAME_ANCESTORS}
        BUILD_CSP_REPORT_URI: ${CSP_REPORT_URI}
        BUILD_CSP_UPGRADE_INSECURE_REQUESTS: ${CSP_UPGRADE_INSECURE_REQUESTS}
        BUILD_PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
        BUILD_PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH}
        BUILD_PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES}
        BUILD_PASSWORD_RESET_MIN_RESPONSE_MS: ${PASSWORD_RESET_MIN_RESPONSE_MS}
        BUILD_PASSWORD_RESET_RESPONSE_JITTER_MS: ${PASSWORD_RESET_RESPONSE_JITTER_MS}
        BUILD_PRICE_WATCH_MAX_PER_USER: ${PRICE_WATCH_MAX_PER_USER}
        BUILD_ALERT_DAILY_MAX_MESSAGES_PER_USER: ${ALERT_DAILY_MAX_MESSAGES_PER_USER}
        BUILD_ALERT_WATCH_LOCK_TIMEOUT_SECONDS: ${ALERT_WATCH_LOCK_TIMEOUT_SECONDS}
        BUILD_ALERT_OUTBOX_BATCH_SIZE: ${ALERT_OUTBOX_BATCH_SIZE}
        BUILD_ALERT_OUTBOX_MAX_ATTEMPTS: ${ALERT_OUTBOX_MAX_ATTEMPTS}
        BUILD_ALERT_OUTBOX_RETRY_BASE_SECONDS: ${ALERT_OUTBOX_RETRY_BASE_SECONDS}
        BUILD_ALERT_OUTBOX_RETRY_MAX_SECONDS: ${ALERT_OUTBOX_RETRY_MAX_SECONDS}
        BUILD_ALERT_OUTBOX_LOCK_TIMEOUT_SECONDS: ${ALERT_OUTBOX_LOCK_TIMEOUT_SECONDS}
        BUILD_PRICE_HISTORY_RETENTION_DAYS: ${PRICE_HISTORY_RETENTION_DAYS}
        BUILD_TICKET_SALES_MAX_ADVANCE_DAYS: ${TICKET_SALES_MAX_ADVANCE_DAYS}
        BUILD_BODY_PARSER_FORM_LIMIT: ${BODY_PARSER_FORM_LIMIT}
        BUILD_BODY_PARSER_JSON_LIMIT: ${BODY_PARSER_JSON_LIMIT}
        BUILD_BODY_PARSER_MULTIPART_LIMIT: ${BODY_PARSER_MULTIPART_LIMIT}
        BUILD_HEALTH_WORKER_STALE_SECONDS: ${HEALTH_WORKER_STALE_SECONDS}
      secrets:
        - app_env
    command: ["node", "bin/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PUBLISHED_HOST}:${PUBLISHED_PORT}:${CONTAINER_PORT}"
    restart: ${SERVICE_RESTART_POLICY}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://' + process.env.HEALTHCHECK_HOST + ':' + process.env.PORT + process.env.HEALTHCHECK_PATH)
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}

  worker:
    <<: *koleo-service
    command: ["node", "ace.js", "alerts:worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: ${SERVICE_RESTART_POLICY}

volumes:
  koleo_data:
    name: ${KOLEO_DATA_VOLUME}

secrets:
  app_env:
    file: ${APP_ENV_FILE}
